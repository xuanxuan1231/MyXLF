name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.2.3），留空则读取 pubspec.yaml'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # 在仓库 Settings > Secrets and variables > Actions 中配置。
  # 未配置时构建仍可完成，但会使用 debug 签名（不建议用于正式发布）。
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    name: 构建 Android 安装包
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 读取 Flutter 版本
        id: flutter
        run: echo "version=$(jq -r '.flutter' .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: 安装 JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      - name: 解析版本号
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_VERSION:-}" ]; then
            version="$REQUESTED_VERSION"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' pubspec.yaml | head -n1)"
          fi
          version="${version#v}"
          if [ -z "$version" ]; then
            echo "::error::无法确定版本号，请在手动触发时填写 version 或检查 pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "构建版本：MyXLF v$version" >> "$GITHUB_STEP_SUMMARY"

      - name: 安装依赖
        run: flutter pub get --enforce-lockfile

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test --exclude-tags e2e

      - name: 配置 Android 签名
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android/app/release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: 提示未配置签名
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::未配置 Android 签名密钥，本次 Release 将使用 debug 签名。请配置 ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD。"

      - name: 构建 APK
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="$GITHUB_RUN_NUMBER"

      - name: 构建 AAB
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="$GITHUB_RUN_NUMBER"

      - name: 整理构建产物
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/MyXLF-${APP_VERSION}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/MyXLF-${APP_VERSION}.aab"
          (
            cd dist
            sha256sum "MyXLF-${APP_VERSION}.apk" "MyXLF-${APP_VERSION}.aab" \
              > "SHA256SUMS-${APP_VERSION}.txt"
          )
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: dist/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: dist

      - name: 创建 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: MyXLF v${{ needs.build.outputs.version }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          fail_on_unmatched_files: true
